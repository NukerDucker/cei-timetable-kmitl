<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMITL Computer Engineering | Timetables 2026</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f2;
    --surface: #ffffff;
    --card: #ffffff;
    --ink: #232323;
    --muted: #5f5f5f;
    --line: #e2dfd9;
    --line-strong: #cfc7c0;
    --guide: #d8d5cf;
    --frame: #cfc7c0;
    --focus: #232323;
    --orange: #c94e17;
    --on-orange: #ffffff;
    --bar-red: #c4442c;
    --bar-green: #0e7a3b;
    --bar-blue: #0f76d6;
    --bar-magenta: #a33a6b;
    --bar-purple: #6b50f0;
    --bar-teal: #0a6e7a;
    --on-bar: #ffffff;
    --today: rgba(31, 31, 31, 0.04);
    --row-h: 20px;
    --head-h: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1c1b1a;
      --surface: #262523;
      --card: #262523;
      --ink: #f5f2ee;
      --muted: #b9b3ad;
      --line: #3a3734;
      --line-strong: #504b47;
      --guide: #3a3734;
      --frame: #5a5650;
      --focus: #f5f2ee;
      --today: rgba(245, 242, 238, 0.05);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1b1a;
    --surface: #262523;
    --card: #262523;
    --ink: #f5f2ee;
    --muted: #b9b3ad;
    --line: #3a3734;
    --line-strong: #504b47;
    --guide: #3a3734;
    --frame: #5a5650;
    --focus: #f5f2ee;
    --today: rgba(245, 242, 238, 0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    font-family: 'IBM Plex Sans Thai', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: 20px 20px 48px;
  }
  .wrap { max-width: 1224px; margin: 0 auto; }
  .shell { background: transparent; }
  .masthead {
    display: grid;
    grid-template-columns: 7fr 2fr 3fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--frame);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .kicker {
    font-size: 0.6875rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.3;
    color: var(--muted);
  }
  h1 {
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-top: 4px;
  }
  .card-label {
    display: block;
    font-size: 0.62rem; font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted);
  }
  .card-value { display: block; font-size: 1.35rem; font-weight: 600; margin-top: 4px; line-height: 1.1; }
  .accent-card { background: var(--orange); color: #ffffff; }
  .accent-card .card-label { color: #ffffff; }

  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* --- sticky controls --- */
  .controls {
    position: sticky; top: 12px; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
    padding: 8px 12px; margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--frame);
    border-radius: 8px;
  }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs + .tabs { border-left: 1px solid var(--line-strong); padding-left: 16px; }
  .tabs label {
    display: inline-flex; align-items: center;
    min-height: 34px; padding: 6px 14px;
    border: 1px solid var(--frame); border-radius: 6px;
    background: var(--card); color: var(--ink);
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif; font-size: 0.8125rem; font-weight: 500;
    cursor: pointer; user-select: none;
  }
  .tabs label:hover { background: var(--bg); }
  #theme-toggle {
    margin-left: auto;
    min-height: 34px; padding: 6px 14px;
    border: 1px solid var(--frame); border-radius: 6px;
    background: var(--card); color: var(--ink);
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif; font-size: 0.8125rem;
    cursor: pointer;
  }
  #theme-toggle:hover { background: var(--bg); }

  body:has(#tt-t1:checked) .wrap label[for="tt-t1"],
  body:has(#tt-t2:checked) .wrap label[for="tt-t2"],
  body:has(#t-y1:checked) .wrap label[for="t-y1"],
  body:has(#t-y2:checked) .wrap label[for="t-y2"],
  body:has(#t-y3:checked) .wrap label[for="t-y3"],
  body:has(#t-y4:checked) .wrap label[for="t-y4"],
  body:has(#v-week:checked) .wrap label[for="v-week"],
  body:has(#v-courses:checked) .wrap label[for="v-courses"],
  body:has(#v-exams:checked) .wrap label[for="v-exams"],
  body:has(#v-plan:checked) .wrap label[for="v-plan"] {
    background: #1a1816; color: #ffffff; border-color: #1a1816;
  }
  body:has(#tt-t1:focus-visible) .wrap label[for="tt-t1"],
  body:has(#tt-t2:focus-visible) .wrap label[for="tt-t2"],
  body:has(#t-y1:focus-visible) .wrap label[for="t-y1"],
  body:has(#t-y2:focus-visible) .wrap label[for="t-y2"],
  body:has(#t-y3:focus-visible) .wrap label[for="t-y3"],
  body:has(#t-y4:focus-visible) .wrap label[for="t-y4"],
  body:has(#v-week:focus-visible) .wrap label[for="v-week"],
  body:has(#v-courses:focus-visible) .wrap label[for="v-courses"],
  body:has(#v-exams:focus-visible) .wrap label[for="v-exams"],
  body:has(#v-plan:focus-visible) .wrap label[for="v-plan"],
  #theme-toggle:focus-visible,
  .course-search:focus-visible,
  .notes summary:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  .tv { display: none; }
  body:has(#tt-t1:checked) .wrap .tv1,
  body:has(#tt-t2:checked) .wrap .tv2 { display: inline; }

  .panel { display: none; }
  body:has(#tt-t1:checked):has(#t-y1:checked) .wrap #p-t1-y1,
  body:has(#tt-t1:checked):has(#t-y2:checked) .wrap #p-t1-y2,
  body:has(#tt-t1:checked):has(#t-y3:checked) .wrap #p-t1-y3,
  body:has(#tt-t1:checked):has(#t-y4:checked) .wrap #p-t1-y4,
  body:has(#tt-t2:checked):has(#t-y1:checked) .wrap #p-t2-y1,
  body:has(#tt-t2:checked):has(#t-y2:checked) .wrap #p-t2-y2,
  body:has(#tt-t2:checked):has(#t-y3:checked) .wrap #p-t2-y3,
  body:has(#tt-t2:checked):has(#t-y4:checked) .wrap #p-t2-y4 { display: block; }

  .view { display: none; }
  body:has(#v-week:checked) .wrap .view-week,
  body:has(#v-courses:checked) .wrap .view-courses,
  body:has(#v-exams:checked) .wrap .view-exams { display: block; }

  /* --- plan view --- */
  /* !important: term × year show rules outrank a plain `.panel` hide by specificity. */
  body:has(#v-plan:checked) .wrap .panel { display: none !important; }
  body:has(#v-plan:checked) .wrap #p-plan { display: block !important; }

  .plan-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: 0 0 6px; }
  .plan-head h2 { margin: 0; font-size: 1rem; }
  .plan-meta { margin: 0; color: var(--muted); font-size: 0.75rem; }
  .plan-actions { margin-left: auto; display: flex; gap: 6px; }
  .plan-btn {
    min-height: 34px; padding: 6px 12px;
    border: 1px solid var(--frame); border-radius: 6px;
    background: var(--card); color: var(--ink);
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif; font-size: 0.78rem;
    cursor: pointer;
  }
  .plan-btn:hover { background: var(--bg); }
  .plan-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .plan-btn[aria-pressed="true"] { background: #1a1816; color: #ffffff; border-color: #1a1816; }
  .plan-conflicts { margin: 0 0 8px; font-size: 0.75rem; color: var(--ink); }
  .plan-conflicts p { margin: 0; color: var(--muted); }
  .plan-conflicts ul { margin: 0; padding-left: 18px; }
  .plan-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .plan-main { min-width: 0; }
  .plan-aside {
    position: sticky; top: 84px;
    max-height: calc(100vh - 100px); overflow-y: auto; overscroll-behavior: contain;
    padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  }
  .plan-aside h3 { margin: 0 0 4px; font-size: 0.8rem; }
  .plan-aside section + section { margin-top: 12px; }
  .plan-gened-status { margin: 0 0 4px; color: var(--muted); font-size: 0.72rem; }
  .plan-gened-status .plan-btn { margin-left: 4px; min-height: 30px; padding: 4px 8px; }
  @media (max-width: 900px) {
    .plan-layout { grid-template-columns: 1fr; }
    .plan-aside { position: static; max-height: none; overflow: visible; overscroll-behavior: auto; padding: 0; border: 0; background: transparent; }
  }
  .plan-list { list-style: none; margin: 0; padding: 0; }
  .plan-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
    padding: 6px 0; border-top: 1px solid var(--line);
    font-size: 0.78rem;
  }
  .plan-row:first-child { border-top: 0; }
  .plan-row[hidden] { display: none; }
  .pr-name { flex: 1 1 140px; font-weight: 600; }
  .pr-meta { font-weight: 400; color: var(--muted); font-size: 0.72rem; }
  .plan-badge {
    font-size: 0.6rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 6px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--muted);
    white-space: nowrap;
  }
  .plan-search {
    width: 100%; min-height: 36px; padding: 6px 10px; margin: 0 0 4px;
    border: 1px solid var(--frame); border-radius: 6px;
    background: var(--card); color: var(--ink);
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif; font-size: 0.8rem;
  }
  .plan-search:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .plan-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 6px; }
  .plan-field { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; color: var(--muted); }
  .plan-select {
    min-height: 30px; padding: 2px 6px;
    border: 1px solid var(--frame); border-radius: 6px;
    background: var(--card); color: var(--ink);
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif; font-size: 0.72rem;
  }
  .plan-select:focus-visible, .plan-day:focus-visible, .plan-check input:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }
  .plan-days { gap: 4px; }
  .plan-day { min-height: 30px; padding: 2px 8px; font-size: 0.7rem; }
  .plan-check { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; color: var(--ink); }
  .plan-group h4 {
    margin: 10px 0 2px; font-size: 0.66rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  }
  .plan-group[hidden] { display: none; }
  .plan-empty { margin: 6px 0; color: var(--muted); font-size: 0.8rem; }
  .plan-entry { flex-wrap: nowrap; }
  .plan-entry .pr-name { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-entry .plan-btn { min-height: 28px; padding: 2px 8px; flex: none; }
  .plan-row.is-clash { border-left: 3px solid var(--bar-red); padding-left: 6px; }
  .plan-badge.is-clash { color: var(--ink); border-color: var(--bar-red); }
  .plan-warn { flex: 1 1 100%; font-size: 0.7rem; color: var(--ink); line-height: 1.25; }
  .g-block.is-ta { outline: 2px dashed var(--on-bar); outline-offset: -4px; }
  .g-block.is-conflict { outline: 3px solid var(--on-bar); outline-offset: -3px; }

  /* --- week view --- */
  .legend {
    display: flex; flex-wrap: wrap; gap: 4px 16px;
    font-size: 0.7rem; color: var(--muted);
    margin: 0 0 8px;
  }
  .legend span { display: inline-flex; align-items: center; }
  .legend:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .legend i {
    width: 9px; height: 9px; border-radius: 2px;
    display: inline-block; margin-right: 5px; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
  }
  .grid {
    display: grid;
    grid-template-columns: 64px repeat(5, minmax(0, 1fr));
    grid-template-rows: var(--head-h) repeat(26, var(--row-h));
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .g-corner, .g-head {
    display: flex; align-items: center;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
  }
  .g-corner { grid-row: 1; grid-column: 1; padding-left: 2px; }
  .g-head { grid-row: 1; justify-content: center; }
  .g-head.is-today { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
  .g-time {
    grid-column: 1;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.72rem; color: var(--muted);
    text-align: right; padding-right: 8px;
    transform: translateY(-7px);
  }
  .g-time-first { transform: none; }
  .g-day {
    grid-row: 2 / -1;
    display: grid;
    grid-template-rows: subgrid;
    border-left: 1px dashed var(--guide);
    background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: 100% calc(var(--row-h) * 2);
  }
  .g-day.is-today { background-color: var(--today); }
  .g-lunch {
    position: relative; z-index: 1;
    grid-column: 2 / 7;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
    border-top: 1px dashed var(--guide);
    border-bottom: 1px dashed var(--guide);
  }
  .g-block {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; gap: 2px;
    margin: 2px; padding: 8px 10px;
    border-radius: 8px; overflow: hidden;
    background: var(--bar-blue); color: var(--on-bar);
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
  }
  .subject-red { background: var(--bar-red); }
  .subject-green { background: var(--bar-green); }
  .subject-magenta { background: var(--bar-magenta); }
  .subject-blue { background: var(--bar-blue); }
  .subject-purple { background: var(--bar-purple); }
  .subject-teal { background: var(--bar-teal); }
  .gb-time { font-size: 0.72rem; font-weight: 500; }
  .gb-name { font-size: 0.8125rem; font-weight: 600; line-height: 1.15; }
  .gb-room { font-size: 0.72rem; }
  .gb-tag {
    align-self: flex-start;
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* --- courses view --- */
  .course-tools {
    display: flex; align-items: center; gap: 12px;
    margin: 2px 0 12px;
  }
  .course-search {
    flex: 1; min-width: 0;
    min-height: 40px; padding: 8px 12px;
    font: inherit; font-size: 0.875rem;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 6px;
  }
  .count {
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.75rem; color: var(--muted); white-space: nowrap;
  }
  .course-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .course-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .cc-top { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }
  .cc-top h2 {
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.9375rem; font-weight: 600; line-height: 1.25;
  }
  .tag {
    flex: none;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.62rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted);
  }
  .cc-dot {
    width: 10px; height: 10px; border-radius: 3px;
    flex: none; display: inline-block; margin-right: 7px;
    vertical-align: 1px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
  }
  .cc-code {
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.75rem; color: var(--muted);
    margin-top: 2px;
  }
  .cc-sessions { list-style: none; margin-top: 6px; }
  .cc-sessions li {
    font-size: 0.8125rem;
    display: flex; flex-wrap: wrap; gap: 2px 8px;
    padding: 2px 0;
  }
  .s-day { font-weight: 600; min-width: 32px; }
  .s-room { color: var(--muted); }
  .cc-lect { font-size: 0.8125rem; margin-top: 6px; }
  .cc-prereq { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .cc-exam {
    font-size: 0.75rem; color: var(--muted);
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--line);
  }
  .empty {
    padding: 16px 0;
    font-size: 0.875rem; color: var(--muted);
  }

  /* --- exams view --- */
  .exam-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  .exam-table th {
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.72rem; font-weight: 600;
    text-align: left; color: var(--muted);
    padding: 0 12px 8px;
  }
  .exam-table td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  .exam-table .exam-course { font-weight: 500; }
  .note { color: var(--muted); font-style: italic; }
  .exam-room { display: block; font-size: 0.72rem; color: var(--muted); }

  .notes {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 0.8125rem; color: var(--muted);
  }
  .notes summary {
    display: flex; align-items: center;
    min-height: 34px;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.8125rem; font-weight: 500;
    color: var(--ink); cursor: pointer;
  }
  .notes ul { margin: 6px 0 0 18px; }
  .notes li { padding: 2px 0; }

  .noscript { padding: 16px; border: 1px solid var(--line-strong); border-radius: 8px; }

  @media (min-width: 1000px) {
    .course-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 760px) {
    .course-list { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    body { padding: 10px 12px 12px; }
    .plan-layout { grid-template-columns: 1fr; }
    .plan-aside { position: static; max-height: none; overflow: visible; overscroll-behavior: auto; padding: 0; border: 0; background: transparent; }
    .plan-actions { margin-left: 0; }
    .plan-row .plan-btn { min-height: 44px; }
    .plan-select, .plan-day { min-height: 44px; }
    .data-status { min-height: 0; margin: 0; font-size: 0.62rem; line-height: 1.2; }
    .masthead { grid-template-columns: 1fr; gap: 6px; margin-bottom: 4px; }
    .stat-card, .accent-card { display: none; }
    .card { padding: 10px 12px; }
    .kicker { display: none; }
    h1 { font-size: 1.35rem; }
    .controls { gap: 4px 8px; padding: 6px 8px; margin-bottom: 4px; top: 8px; }
    .tabs + .tabs {
      border-left: 0; padding-left: 0;
      border-top: 1px solid var(--line-strong); padding-top: 4px;
    }
    .legend {
      flex-wrap: nowrap; overflow-x: auto; white-space: nowrap;
      gap: 0 14px; font-size: 0.68rem; margin: 0 0 1px;
      padding-bottom: 2px;
    }
    .tabs { gap: 4px; }
    .tabs label { min-height: 44px; padding: 8px 12px; font-size: 0.78rem; }
    #theme-toggle { min-height: 44px; padding: 8px 10px; margin-left: 0; }
    .course-search { min-height: 44px; }
    .course-list { gap: 8px; }
    .course-card { padding: 10px 12px; }
    .grid { display: block; border-right: 0; }
    .g-corner, .g-head, .g-time, .g-lunch { display: none; }
    .g-day {
      display: block; grid-row: auto;
      border-left: 0; border-top: 1px solid var(--line);
      background-image: none;
      padding: 0;
    }
    .g-day.is-today::before {

async function fetchJson(url, timeoutMs = 10000) {
  let lastError;
  for (let attempt = 0; attempt < 2; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal, headers: { Accept: "application/json" } });
      if (!res.ok) throw Object.assign(new Error("HTTP " + res.status), { fatal: res.status < 500 });
      const data = await res.json();
      clearTimeout(timer);
      return data;
    } catch (err) {
      clearTimeout(timer);
      lastError = err;
      if (err.fatal) break;
      if (attempt === 0) await new Promise((r) => setTimeout(r, 600));
    }
  }
  throw lastError;
}

function flattenRows(payload, onlyCei) {
  const rows = [];
  if (!Array.isArray(payload)) return rows;
  for (const program of payload) {
    if (onlyCei && String(program.curriculum2_id) !== "127") continue;
    const classYear = String(program.class ?? "");
    for (const group of program.teachtable || []) {
      for (const row of group.data || []) {
        if (String(row.closed) !== "0") continue;
        rows.push({ ...row, classYear });
      }
    }
  }
  const seen = new Set();
  return rows.filter((r) => {
    const key = r.teach_table_id || [r.subject_id, r.section, r.teach_day, r.teach_time].join("|");
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function schedulable(row) {
  const day = Number(row.teach_day);
  return day >= 2 && day <= 7 && row.teach_time && row.teach_time !== "00:00:00" && row.teach_time2 && row.teach_time2 !== "00:00:00";
}

function parseExtraMeetings(text) {
  const out = [];
  for (const match of (text || "").matchAll(/(\d)x(\d\d:\d\d)-(\d\d:\d\d)/g)) {
    out.push({ day: dayName(match[1]), start: match[2], end: match[3] });
  }
  return out.filter((s) => s.day);
}

function chooseSection(rows) {
  const lectures = rows.filter((r) => r.lect_or_prac !== "ป" && r.section);
  const pool = lectures.length ? lectures : rows;
  return pool.map((r) => r.section).filter(Boolean).sort((a, b) => Number(a) - Number(b) || a.localeCompare(b))[0] || null;
}

function selectCuratedRows(rows, course, classYear) {
  const inClass = rows.filter((r) => r.classYear === String(classYear));
  const pool = inClass.length ? inClass : rows.filter((r) => !["1", "2", "3", "4"].includes(r.classYear));
  const valid = pool.filter(schedulable);
  if (!valid.length) return null;
  const wanted = new Set(course.sessions.map((s) => s.section).filter(Boolean));
  let anchor = null;
  if (wanted.size) {
    const exact = valid.filter((r) => wanted.has(r.section));
    anchor = (exact.find((r) => r.lect_or_prac !== "ป") || exact[0] || {}).section || null;
    if (!anchor) {
      if (!course.code.startsWith("01276")) return null;
      anchor = chooseSection(valid);
    }
  } else {
    anchor = chooseSection(valid);
  }
  if (!anchor) return null;
  const keep = new Set([anchor]);
  for (const row of valid.filter((r) => r.section === anchor)) {
    if (row.sec_pair) keep.add(row.sec_pair);
    const partner = valid.find((r) => r.sec_pair === row.section);
    if (partner) keep.add(partner.section);
  }
  return valid.filter((r) => keep.has(r.section));
}

function sessionsFromRows(rows) {
  const raw = [];
  for (const row of rows) {
    const day = dayName(row.teach_day);
    if (!day || day === "Sun") continue;
    const type = row.lect_or_prac === "ป" ? "lab" : undefined;
    const room = row.room_name || null;
    raw.push({ day, start: hhmm(row.teach_time), end: hhmm(row.teach_time2), room, section: row.section, ...(type ? { type } : {}) });
    for (const extra of parseExtraMeetings(row.teachtime_str)) {
      raw.push({ day: extra.day, start: extra.start, end: extra.end, room, section: row.section, ...(type ? { type } : {}) });
    }
  }
  const seen = new Set();
  const unique = raw.filter((s) => {
    const key = [s.day, s.start, s.end, s.room, s.section, s.type].join("|");
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  const sorted = unique.sort((a, b) => DAY_ORDER.indexOf(a.day) - DAY_ORDER.indexOf(b.day) || minutes(a.start) - minutes(b.start));
  const merged = [];
  for (const s of sorted) {
    const prev = merged[merged.length - 1];
    const contiguous = prev && prev.day === s.day && prev.room === s.room && prev.section === s.section && prev.type === s.type &&
      minutes(s.start) - minutes(prev.end) >= 0 && minutes(s.start) - minutes(prev.end) <= 15;
    if (contiguous) {
      if (minutes(s.end) > minutes(prev.end)) prev.end = s.end;
    } else {
      merged.push({ ...s });
    }
  }
  return merged.map((s) => ({
    day: s.day,
    start: s.start,
    end: s.end,
    room: s.room,
    section: s.section,
    ...(s.type ? { type: s.type } : {})
  }));
}

function teacherNames(rows) {
  const names = [];
  for (const row of rows) {
    for (const part of String(row.teacher_list_en || "").split(/<\/div>/)) {
      const name = part.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
      if (name) names.push(titleCase(name));
    }
  }
  return [...new Set(names)];
}

function apiDate(value) {
  return value && !String(value).startsWith("0000-00-00") ? value : null;
}

function examPatch(rows, curated = {}) {
  const lectures = rows.filter((r) => r.lect_or_prac !== "ป");
  const row = lectures.find((r) => apiDate(r.midterm_start_date_time) || apiDate(r.final_start_date_time)) ||
    rows.find((r) => apiDate(r.midterm_start_date_time) || apiDate(r.final_start_date_time));
  const exams = { ...curated };
  if (!row) return exams;
  const mid = apiDate(row.midterm_start_date_time);
  const final = apiDate(row.final_start_date_time);
  const midEnd = apiDate(row.midterm_end_date_time);
  const finalEnd = apiDate(row.final_end_date_time);
  if (mid) {
    exams.mid = mid.slice(0, 10);
    delete exams.midNote;
  }
  if (final) {
    exams.final = final.slice(0, 10);
    delete exams.finalNote;
  }
  const start = final || mid;
  const end = final ? finalEnd : midEnd;
  if (start && end) exams.time = hhmm(start.slice(11)) + "–" + hhmm(end.slice(11));
  return exams;
}

function courseType(code, rows, curatedType) {
  if (curatedType) return curatedType;
  if (rows.length && rows.every((r) => r.lect_or_prac === "ป")) return "lab";
  if (code.startsWith("9664")) return "gened";
  return "lecture";
}

function makeCourse(code, rows, curated) {
  return {
    name: curated ? curated.name : titleCase(rows[0].subject_name_en),
    code,
    credits: rows[0].credit_str || (curated ? curated.credits : ""),
    color: curated ? curated.color : stableColor(code),
    type: courseType(code, rows, curated ? curated.type : null),
    lecturers: teacherNames(rows).length ? teacherNames(rows) : (curated ? curated.lecturers : []),
    sessions: sessionsFromRows(rows),
    exams: examPatch(rows, curated ? curated.exams : {}),
    prereq: curated ? curated.prereq : undefined
  };
}

function mergeCourse(curated, rows) {
  const apiSessions = sessionsFromRows(rows);
  if (!apiSessions.length) return curated;
  const sessions = apiSessions.map((s) => {
    if (s.room) return s;
    const match = curated.sessions.find((c) => c.day === s.day && c.start === s.start) ||
      curated.sessions.find((c) => c.day === s.day && c.section === s.section);
    return match && match.room ? { ...s, room: match.room } : s;
  });
  return {
    ...curated,
    credits: rows[0].credit_str || curated.credits,
    lecturers: teacherNames(rows).length ? teacherNames(rows) : curated.lecturers,
    sessions,
    exams: examPatch(rows, curated.exams)
  };
}

function mergeTerm(term, rows) {
  const byCode = new Map();
  for (const row of rows) {
    if (!byCode.has(row.subject_id)) byCode.set(row.subject_id, []);
    byCode.get(row.subject_id).push(row);
  }
  const seenCodes = new Set(term.years.flatMap((y) => y.courses.map((c) => c.code)));
  const years = term.years.map((year) => {
    const n = Number(year.id.slice(1));
    const known = new Set(year.courses.map((c) => c.code));
    const courses = year.courses.map((course) => {
      const candidates = byCode.get(course.code) || [];
      const selected = selectCuratedRows(candidates, course, n);
      return selected ? mergeCourse(course, selected) : course;
    });
    for (const [code, candidates] of byCode) {
      if (!code.startsWith("01276") || known.has(code) || seenCodes.has(code)) continue;
      const inClass = candidates.filter((r) => r.classYear === String(n) && schedulable(r));
      if (!inClass.length) continue;
      const anchor = chooseSection(inClass);
      const selected = inClass.filter((r) => r.section === anchor || r.sec_pair === anchor);
      const course = selected.length ? makeCourse(code, selected, null) : null;
      if (course && course.sessions.length) {
        courses.push(course);
        known.add(code);
        seenCodes.add(code);
      }
    }
    return { ...year, courses };
  });
  return { ...term, years };
}

async function fetchTerm(config) {
  const primary = flattenRows(await fetchJson(apiUrl(config, "by_class")), true);
  if (!primary.length) throw new Error("Empty timetable for " + config.label);
  const found = new Set(primary.map((r) => r.subject_id));
  const missing = [...new Set(CURATED_TERMS.find((t) => t.label === config.label).years.flatMap((y) => y.courses.map((c) => c.code)))]
    .filter((code) => !found.has(code)).slice(0, 12);
  const extras = await Promise.allSettled(missing.map((code) => fetchJson(apiUrl(config, "by_subject_id", code))));
  const extraRows = extras.flatMap((res) => res.status === "fulfilled" ? flattenRows(res.value, false) : []);
  return primary.concat(extraRows);
}

function stamp(ms) {
  return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(ms));

function snapshotUi() {
  const searches = {};
  document.querySelectorAll(".course-search, .plan-search").forEach((input) => { searches[input.id] = input.value; });
  const notes = [...document.querySelectorAll("details.notes")].map((d) => d.open);
  const active = document.activeElement;
  return {
    searches,
    notes,
    activeId: active && active.id ? active.id : null,
    selectionStart: active && active.selectionStart,
    selectionEnd: active && active.selectionEnd,
    scrollY: window.scrollY
  };
}

function restoreUi(ui) {
  Object.entries(ui.searches).forEach(([id, value]) => {
    const input = document.getElementById(id);
    if (input) input.value = value;
  });
  document.querySelectorAll("details.notes").forEach((d, i) => { if (ui.notes[i] !== undefined) d.open = ui.notes[i]; });
  if (ui.activeId) {
    const active = document.getElementById(ui.activeId);
    if (active) {
      active.focus({ preventScroll: true });
      try { active.setSelectionRange(ui.selectionStart, ui.selectionEnd); } catch (err) { /* not a text field */ }
    }
  }
  window.scrollTo(0, ui.scrollY);
}

async function loadLiveData() {
  const cached = readCache();
  if (cached) {
    TERMS = cached.terms;
    renderAll();
    if (Date.now() - cached.savedAt < CACHE_TTL) {
      setDataStatus("Live · saved " + stamp(cached.savedAt));
      return;
    }
  }
  setDataStatus(cached ? "Checking for updates…" : "Loading live schedule…");
  const results = await Promise.allSettled(TERM_CONFIG.map(async (config) => ({ config, rows: await fetchTerm(config) })));
  let updated = 0;
  const baseTerms = cached ? cached.terms : CURATED_TERMS;
  const liveTerms = baseTerms.map((term) => {
    const hit = results.find((r) => r.status === "fulfilled" && r.value.config.label === term.label);
    if (!hit) return term;
    updated++;
    return mergeTerm(term, hit.value.rows);
  });
  if (!updated) {
    setDataStatus(cached ? "Saved copy · " + stamp(cached.savedAt) : "Offline snapshot · KMITL unavailable");
    return;
  }
  const ui = snapshotUi();
  TERMS = liveTerms;
  renderAll();
  restoreUi(ui);
  if (updated === TERM_CONFIG.length) writeCache();
  setDataStatus((updated === TERM_CONFIG.length ? "Live · updated " : "Live · partial update ") + stamp(Date.now()));
}

function renderWeek(year, range) {
  const startMin = range ? range.start : DAY_START;
  const slotCount = range ? range.slots : SLOTS;
  const hasSat = year.courses.some((c) => c.sessions.some((s) => s.day === "Sat"));
  const days = hasSat ? [...DAYS, "Sat"] : DAYS;
  const legend = year.courses.map((c) =>
    `<span><i class="subject-${esc(c.color)}" aria-hidden="true"></i>${esc(c.name)}</span>`
  ).join("");
  let h = `<div class="legend" tabindex="0" aria-label="Course color legend">${legend}</div>` +
    `<div class="grid" style="grid-template-columns:64px repeat(${days.length}, minmax(0,1fr));` +
    `grid-template-rows:var(--head-h) repeat(${slotCount}, var(--row-h))">`;

  h += '<div class="g-corner">Time</div>';
  days.forEach((d) => { h += `<div class="g-head" data-day="${d}">${d}</div>`; });
  for (let r = 0; r < slotCount; r++) {
    const minute = startMin + r * SLOT;
    if (minute % 60 !== 0 && r !== 0) continue;
    const first = r === 0 ? " g-time-first" : "";
    h += `<div class="g-time${first}" style="grid-row:${r + 2}">${fmtTime(minute)}</div>`;
  }
  const lunchSlot = (12 * 60 - startMin) / SLOT;
  if (lunchSlot >= 0 && lunchSlot + 2 <= slotCount) {
    h += `<div class="g-lunch" style="grid-row:${lunchSlot + 2} / ${lunchSlot + 4}">Lunch</div>`;
  }

  days.forEach((d, i) => {
    const sessions = [];
    year.courses.forEach((c) => c.sessions.forEach((s) => {
      if (s.day === d) sessions.push({ ...s, course: c });
    }));
    sessions.sort((a, b) => toMin(a.start) - toMin(b.start));
    const laneEnds = [];
    const placed = sessions.map((s) => {
      let lane = laneEnds.findIndex((end) => end <= toMin(s.start));
      if (lane === -1) { lane = laneEnds.length; laneEnds.push(0); }
      laneEnds[lane] = toMin(s.end);
      return { session: s, lane };
    });
    const cols = laneEnds.length;
    const overlaps = (s) => sessions.filter((o) =>
      toMin(o.start) < toMin(s.end) && toMin(s.start) < toMin(o.end)).length;
    h += `<div class="g-day" data-day="${d}" style="grid-column:${i + 2}` +
      (cols > 1 ? `;grid-template-columns:repeat(${cols}, minmax(0,1fr))` : "") + `">`;
    placed.forEach(({ session: s, lane }) => {
      const start = toMin(s.start);
      const snapped = startMin + Math.floor((start - startMin) / SLOT) * SLOT;
      const localRow = (snapped - startMin) / SLOT + 1;
      const span = Math.max(1, Math.round((toMin(s.end) - snapped) / SLOT));
      const type = s.type || s.course.type;
      const laneStyle = cols > 1
        ? (overlaps(s) > 1 ? `;grid-column:${lane + 1}` : `;grid-column:1 / -1`)
        : "";
      const isTa = s.course.planRole === "TA";
      const isConflict = Boolean(s.course.hasConflict);
      h += `<div class="g-block${isTa ? " is-ta" : ""}${isConflict ? " is-conflict" : ""} type-${type} subject-${esc(s.course.color)}" style="grid-row:${localRow} / span ${span}${laneStyle}">` +
        `<span class="gb-time">${esc(s.start)}–${esc(s.end)}</span>` +
        `<span class="gb-name">${esc(s.course.name)}</span>` +
        (s.room ? `<span class="gb-room">${esc(s.room)}</span>` : "") +
        (type !== "lecture" ? `<span class="gb-tag">${typeLabel(type)}</span>` : "") +
        (isTa ? `<span class="gb-tag">TA</span>` : "") +
        (isConflict ? `<span class="gb-tag">Conflict</span>` : "") +
        `</div>`;
    });
    h += "</div>";
  });
  h += "</div>";
  return h;
}

function renderCourses(year, panelId) {

  const cards = courses.map((c) => {

      c.name, c.code, c.credits, c.lecturers.join(" "), typeLabel(c.type),

        (s.room ? `<span class="s-room">${esc(s.room)}</span>` : "") + kind + `</li>`;

      `<div class="cc-top"><h2><span class="cc-dot subject-${esc(c.color)}" aria-hidden="true"></span>${esc(c.name)}</h2>` +
      (c.type !== "lecture" ? `<span class="tag">${typeLabel(c.type)}</span>` : "") +

    `<span class="count" aria-live="polite">${courses.length} courses</span>` +
    `</div>` +

function renderExams(year) {

    const mid = c.exams.mid

}

/* --- plan builder --- */
const GENED = {};
const GENED_CACHE_KEY = "cei-gened-cache-v2";
const GENED_TTL = 6 * 60 * 60 * 1000;

function restoreGenedCache() {
  try {
    const raw = JSON.parse(localStorage.getItem(GENED_CACHE_KEY) || "null");
    if (!raw || raw.v !== 1 || !raw.terms) return;
    for (const termId of ["t1", "t2"]) {
      const entry = raw.terms[termId];
      if (entry && Array.isArray(entry.courses) && entry.courses.length) {
        GENED[termId] = { status: "ready", courses: entry.courses, savedAt: Number(entry.savedAt) || 0 };
      }
    }
  } catch (err) { /* cache unavailable */ }
}

function writeGenedCache() {
  try {
    const terms = {};
    for (const termId of ["t1", "t2"]) {
      const state = GENED[termId];
      if (state && state.status === "ready" && state.savedAt) {
        terms[termId] = { savedAt: state.savedAt, courses: state.courses };
      }
    }
    if (!Object.keys(terms).length) return;
    localStorage.setItem(GENED_CACHE_KEY, JSON.stringify({ v: 1, terms }));
  } catch (err) { /* quota or storage unavailable */ }
}

function genedUrl(config) {
  const p = new URLSearchParams({
    function: "get-teach-table-show",
    level_id: "1",
    mode: "by_subject_owner_id",
    selected_year: config.year,
    selected_semester: config.semester,
    selected_faculty: "01",
    search_all_faculty: "false",
    selected_subject_owner_id: "48",
    search_all_department: "true",
    search_all_curriculum: "true",
    search_all_branch: "true",
    search_all_class_year: "true"
  });
  return API_PATH + "?" + p.toString();
}

function genedCoursesFromRows(rows) {
  const groups = new Map();
  for (const row of rows) {
    if (!String(row.subject_id).startsWith("966")) continue;
    if (!schedulable(row)) continue;
    const pair = row.sec_pair ? [row.section, row.sec_pair].sort((a, b) => Number(a) - Number(b) || a.localeCompare(b)) : [row.section];
    const anchor = pair[0];
    if (!anchor) continue;
    const key = `${row.subject_id}#${anchor}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  }
  return [...groups.entries()].map(([key, groupRows]) => {
    const course = makeCourse(groupRows[0].subject_id, groupRows, null);
    if (!course.sessions.length) return null;
    return { ...course, key, section: key.slice(key.indexOf("#") + 1), type: "gened", planYear: "Gen Ed" };
  }).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
}

function loadGened(termId) {
  const state = GENED[termId];
  if (state && state.status === "loading") return;
  if (state && state.status === "ready" && (state.refreshing ||
    (state.savedAt && Date.now() - state.savedAt < GENED_TTL))) return;
  const config = TERM_CONFIG.find((t) => t.id === termId);
  if (!config) return;
  const hadData = Boolean(state && state.status === "ready" && state.courses.length);
  if (hadData) GENED[termId] = { ...state, refreshing: true };
  else GENED[termId] = { status: "loading", courses: [] };
  fetchJson(genedUrl(config), 30000)
    .then((payload) => {
      GENED[termId] = { status: "ready", courses: genedCoursesFromRows(flattenRows(payload, false)), savedAt: Date.now() };
      writeGenedCache();
    })
    .catch(() => {
      if (hadData) GENED[termId] = { ...state, refreshing: false };
      else GENED[termId] = { status: "error", courses: [] };
    })
    .then(() => refreshPlan());
}

function planCourses(termId) {
  const term = TERMS.find((t) => t.id === termId);
  if (!term) return [];
  const pool = new Map();
  for (const year of term.years) {
    for (const course of year.courses) {
      const entry = { ...course, key: `${course.code}@${year.id}`, planYear: year.label };
      if (!pool.has(entry.key)) pool.set(entry.key, entry);
      if (!pool.has(course.code)) pool.set(course.code, { ...entry, key: course.code });
    }
  }
  const gened = GENED[termId];
  if (gened && gened.status === "ready") {
    for (const course of gened.courses) if (!pool.has(course.key)) pool.set(course.key, course);
  }
  const out = [];
  const seenCodes = new Set();
  for (const entry of plan) {
    if (entry.term !== termId) continue;
    const course = pool.get(entry.key);
    if (!course || seenCodes.has(course.code)) continue;
    seenCodes.add(course.code);
    const labSessions = course.sessions.filter((s) => s.type === "lab" || (!s.type && course.type === "lab"));
    const hasLab = labSessions.length > 0;
    const isTa = entry.role === "ta" && hasLab;
    out.push({
      ...course,
      hasLab,
      planRole: isTa ? "TA" : "take",
      sessions: isTa ? labSessions : course.sessions
    });
  }
  return out;
}

function planConflictDetails(courses) {
  const out = [];
  for (let i = 0; i < courses.length; i++) {
    for (let j = i + 1; j < courses.length; j++) {
      const a = courses[i], b = courses[j];
      for (const s of a.sessions) {
        for (const t of b.sessions) {
          if (s.day !== t.day) continue;
          if (toMin(s.start) < toMin(t.end) && toMin(t.start) < toMin(s.end)) {
            out.push({ kind: "time", a, b, day: s.day, start: s.start, end: s.end,
              label: `${a.name} ↔ ${b.name} · ${s.day} ${s.start}–${s.end}` });
          }
        }
      }
      for (const kind of ["mid", "final"]) {
        if (a.planRole === "TA" || b.planRole === "TA") break;
        const day = a.exams[kind];
        if (!day || day !== b.exams[kind]) continue;
        if (a.exams.time && b.exams.time && a.exams.time !== b.exams.time) continue;
        out.push({ kind: "exam", a, b, examKind: kind, date: day,
          label: `${a.name} ↔ ${b.name} · ${kind} exam ${fmtDate(day)}` });
      }
    }
  }
  return out;
}

function planConflicts(courses) {
  return [...new Set(planConflictDetails(courses).map((d) => d.label))];
}

function courseWarnings(course, planList) {
  const warnings = [];
  const seen = new Set();
  for (const other of planList) {
    for (const s of course.sessions) {
      for (const t of other.sessions) {
        if (s.day !== t.day) continue;
        if (!(toMin(s.start) < toMin(t.end) && toMin(t.start) < toMin(s.end))) continue;
        const key = `${other.key}|${s.day}|${s.start}|${s.end}`;
        if (seen.has(key)) continue;
        seen.add(key);
        warnings.push(`${s.day} ${s.start}–${s.end} with ${other.name}`);
      }
    }
    for (const kind of ["mid", "final"]) {
      if (course.planRole === "TA" || other.planRole === "TA") break;
      const day = course.exams && course.exams[kind];
      if (!day || !other.exams || day !== other.exams[kind]) continue;
      if (course.exams.time && other.exams.time && course.exams.time !== other.exams.time) continue;
      warnings.push(`${kind} exam ${fmtDate(day)} with ${other.name}`);
    }
  }
  return [...new Set(warnings)];
}

function planTimeRange(courses) {
  let min = Infinity, max = -Infinity;
  for (const c of courses) {
    for (const s of c.sessions) {
      const a = toMin(s.start), b = toMin(s.end);
      if (a < min) min = a;
      if (b > max) max = b;
    }
  }
  if (!Number.isFinite(min) || !Number.isFinite(max)) return { start: DAY_START, slots: SLOTS };
  const start = Math.max(0, Math.floor(min / SLOT) * SLOT);
  const end = Math.min(24 * 60, Math.ceil(max / SLOT) * SLOT);
  return { start, slots: Math.max(2, Math.ceil((end - start) / SLOT)) };
}

function courseCredits(c) {
  const n = parseInt(c.credits, 10);
  return Number.isFinite(n) ? n : null;
}

function courseHasDay(c, days) {
  return !days.length || c.sessions.some((s) => days.includes(s.day));
}

function courseClashesWithPlan(c, planList) {
  return c.sessions.some((s) => planList.some((x) => x.sessions.some((t) =>
    t.day === s.day && toMin(s.start) < toMin(t.end) && toMin(t.start) < toMin(s.end))));
}

function earliestMinute(c) {
  const vals = c.sessions.map((s) => DAY_ORDER.indexOf(s.day) * 1440 + toMin(s.start)).filter((n) => n >= 0);
  return vals.length ? Math.min(...vals) : Infinity;
}

function sortPlanOptions(items, sort) {
  return items.slice().sort((a, b) => {
    if (sort === "code") return a.course.code.localeCompare(b.course.code, undefined, { numeric: true });
    if (sort === "time") return earliestMinute(a.course) - earliestMinute(b.course) || a.course.name.localeCompare(b.course.name);
    if (sort === "credits") {
      const ca = courseCredits(a.course), cb = courseCredits(b.course);
      return (ca === null ? 99 : ca) - (cb === null ? 99 : cb) || a.course.name.localeCompare(b.course.name);
    }
    return a.course.name.localeCompare(b.course.name);
  });
}

function renderPlanPanel(termId) {
  const term = TERMS.find((t) => t.id === termId);
  if (!term) return "";
  const courses = planCourses(termId);
  const details = planConflictDetails(courses);
  const conflictKeys = new Set();
  for (const d of details) {
    conflictKeys.add(d.a.key);
    conflictKeys.add(d.b.key);
  }
  for (const c of courses) c.hasConflict = conflictKeys.has(c.key);
  const clashes = [...new Set(details.map((d) => d.label))];
  const inPlan = new Set(courses.map((c) => c.code));
  const gened = GENED[termId] || { status: "idle", courses: [] };
  const unresolved = gened.status === "ready"
    ? plan.filter((e) => e.term === termId && !courses.some((c) => c.key === e.key)).length
    : 0;
  const unresolvedNote = unresolved
    ? `<li class="plan-empty">${unresolved} saved ${unresolved === 1 ? "course is" : "courses are"} not offered in this Gen Ed list.</li>`
    : "";

  const entries = courses.length ? courses.map((c) =>
    `<li class="plan-row plan-entry">` +
      `<span class="plan-badge">${esc(c.planYear)}</span>` +
      `<span class="pr-name">${esc(c.name)}<span class="pr-meta"> · ${esc(c.code)}` +
        `${c.section ? " · Sec " + esc(c.section) : ""}</span></span>` +
      (c.hasLab
        ? `<button type="button" class="plan-btn" data-plan-role="${esc(c.key)}" data-focus="role-${esc(c.key)}"` +
          ` aria-pressed="${c.planRole === "TA"}" aria-label="Assist the lab (TA) for ${esc(c.name)}">TA</button>`
        : "") +
      `<button type="button" class="plan-btn" data-plan-remove="${esc(c.key)}" data-focus="remove-${esc(c.key)}"` +
        ` aria-label="Remove ${esc(c.name)} from plan">&times;</button>` +
    `</li>`
  ).join("") : `<li class="plan-empty">No courses yet. Add one from the list.</li>`;

  const baseOptions = term.years.flatMap((year) => year.courses
    .filter((c) => !inPlan.has(c.code))
    .map((c) => ({ course: c, key: `${c.code}@${year.id}`, badge: year.label, group: year.id, groupLabel: year.label })))
    .concat(gened.courses
      .filter((c) => !inPlan.has(c.code))
      .map((c) => ({ course: c, key: c.key, badge: "Gen Ed", group: "gened", groupLabel: "Gen Ed" })));

  const groupsOrdered = term.years.map((y) => ({ key: y.id, label: y.label }))
    .concat([{ key: "gened", label: gened.status === "ready" ? `Gen Ed (${gened.courses.length})` : "Gen Ed" }]);
  const creditValues = [...new Set(baseOptions.map((o) => courseCredits(o.course)).filter((n) => n !== null))].sort((a, b) => a - b);

  const filteredOptions = baseOptions.filter((o) => {
    if (planFilter.cohort !== "all" && o.group !== planFilter.cohort) return false;
    if (planFilter.credit !== "" && courseCredits(o.course) !== Number(planFilter.credit)) return false;
    if (!courseHasDay(o.course, planFilter.days)) return false;
    if (planFilter.hideConflicts && courseClashesWithPlan(o.course, courses)) return false;
    return true;
  });

  const groups = [];
  const groupIndex = new Map();
  for (const option of filteredOptions) {
    if (!groupIndex.has(option.group)) {
      const group = { key: option.group, label: option.groupLabel, items: [] };
      groupIndex.set(option.group, group);
      groups.push(group);
    }
    groupIndex.get(option.group).items.push(option);
  }
  groups.sort((a, b) => groupsOrdered.findIndex((g) => g.key === a.key) - groupsOrdered.findIndex((g) => g.key === b.key));

  const optionHtml = groups.map((group) =>
    `<div class="plan-group" data-group="${esc(group.key)}"><h4>${esc(group.label)}</h4><ul class="plan-list">` +
      sortPlanOptions(group.items, planFilter.sort).map(({ course: c, key, badge }) => {
        const warns = courseWarnings(c, courses);
        const search = [c.name, c.code, badge, c.section || "", ...c.lecturers,
          warns.length ? "conflict " + warns.join(" ") : ""].join(" ").toLowerCase();
        const times = c.sessions.map((s) => `${s.day} ${s.start}–${s.end}`).join(", ");
        const meta = `${c.code}${c.section ? " · Sec " + c.section : ""} · ${times}`;
        const label = c.section ? `${c.name} section ${c.section}` : c.name;
        return `<li class="plan-row${warns.length ? " is-clash" : ""}" data-search="${esc(search)}">` +
          `<span class="plan-badge">${esc(badge)}</span>` +
          (warns.length ? `<span class="plan-badge is-clash">Clash</span>` : "") +
          `<span class="pr-name">${esc(c.name)}<span class="pr-meta"> · ${esc(meta)}</span></span>` +
          (warns.length
            ? `<span class="plan-warn" title="${esc(warns.join(" · "))}">` +
              `<span aria-hidden="true">⚠ </span>${esc(warns[0])}` +
              `${warns.length > 1 ? ` (+${warns.length - 1} more)` : ""}</span>`
            : "") +
          `<button type="button" class="plan-btn" data-plan-add="${esc(key)}" data-focus="add-${esc(key)}"` +
            ` aria-label="Add ${esc(label)} to plan${warns.length ? ", conflicts with the current plan" : ""}">Add</button>` +
        `</li>`;
      }).join("") +
    `</ul></div>`
  ).join("");

  const filterActive = planFilter.cohort !== "all" || planFilter.credit !== "" ||
    planFilter.days.length > 0 || planFilter.hideConflicts;

  const controls =
    `<div class="plan-controls">` +
      `<label class="plan-field"><span>Sort</span><select class="plan-select" data-plan-sort data-focus="sort">` +
        [["name", "Name"], ["code", "Code"], ["time", "Day & time"], ["credits", "Credits"]]
          .map(([value, label]) => `<option value="${value}"${planFilter.sort === value ? " selected" : ""}>${label}</option>`).join("") +
      `</select></label>` +
      `<label class="plan-field"><span>Cohort</span><select class="plan-select" data-plan-cohort data-focus="cohort">` +
        `<option value="all">All</option>` +
        groupsOrdered.map((g) => `<option value="${g.key}"${planFilter.cohort === g.key ? " selected" : ""}>${esc(g.label)}</option>`).join("") +
      `</select></label>` +
    `</div>` +
    `<div class="plan-controls plan-days">` +
      ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) =>
        `<button type="button" class="plan-btn plan-day" data-plan-day="${d}" data-focus="day-${d}"` +
          ` aria-pressed="${planFilter.days.includes(d)}">${d}</button>`).join("") +
    `</div>` +
    `<div class="plan-controls">` +
      `<label class="plan-field"><span>Credits</span><select class="plan-select" data-plan-credit data-focus="credit">` +
        `<option value="">Any</option>` +
        creditValues.map((n) => `<option value="${n}"${planFilter.credit === String(n) ? " selected" : ""}>${n}</option>`).join("") +
      `</select></label>` +
      `<label class="plan-check"><input type="checkbox" data-plan-hide-conflicts data-focus="hide-conflicts"` +
        `${planFilter.hideConflicts ? " checked" : ""}> Hide conflicting</label>` +
      (filterActive ? `<button type="button" class="plan-btn" data-plan-filter-clear data-focus="filter-clear">Clear</button>` : "") +
    `</div>`;

  const genedStatus = gened.status === "loading"
    ? `<p class="plan-gened-status">Loading Gen Ed courses…</p>`
    : gened.status === "error"
      ? `<p class="plan-gened-status">Gen Ed courses unavailable. ` +
        `<button type="button" class="plan-btn" data-plan-gened-retry>Retry</button></p>`
      : "";

  const conflictHtml = clashes.length
    ? `<ul>${clashes.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>`
    : `<p>No conflicts.</p>`;

  return `<section class="panel" id="p-plan" aria-label="My plan for ${esc(term.label)}">` +
    `<div class="plan-head">` +
      `<h2>My plan · ${esc(term.label)}</h2>` +
      `<p class="plan-meta">${courses.length} ${courses.length === 1 ? "course" : "courses"} · ` +
        `${clashes.length} ${clashes.length === 1 ? "conflict" : "conflicts"}</p>` +
      `<div class="plan-actions">` +
        `<button type="button" class="plan-btn" data-plan-download>Download PNG</button>` +
        `<button type="button" class="plan-btn" data-plan-clear data-focus="clear">Clear term</button>` +
      `</div>` +
    `</div>` +
    `<div class="plan-conflicts">${conflictHtml}</div>` +
    `<div class="plan-layout">` +
      `<div class="plan-main">${renderWeek({ courses }, planTimeRange(courses))}</div>` +
      `<aside class="plan-aside" aria-label="Plan courses">` +
        `<section><h3>In this plan</h3><ul class="plan-list">${entries}${unresolvedNote}</ul></section>` +
        `<section class="plan-picker"><h3>Add a course</h3>${genedStatus}` +
          `<input class="plan-search" type="search" id="plan-search" placeholder="Search course, code, lecturer"` +
            ` aria-label="Search all ${esc(term.label)} courses to add">` +
          controls +
          `${optionHtml}` +
          `<p class="empty" hidden>No courses match the filters.</p>` +
        `</section>` +
      `</aside>` +
    `</div>` +
    `</section>`;
}

function applyPlanFilter() {
  const panel = document.getElementById("p-plan");
  const input = document.getElementById("plan-search");
  if (!panel || !input) return;
  const q = input.value.trim().toLowerCase();
  let shown = 0;
  panel.querySelectorAll(".plan-group").forEach((group) => {
    let groupShown = 0;
    group.querySelectorAll(".plan-row").forEach((row) => {
      const ok = !q || row.dataset.search.includes(q);
      row.hidden = !ok;
      if (ok) groupShown++;
    });
    group.hidden = groupShown === 0;
    shown += groupShown;
  });
  const empty = panel.querySelector(".plan-picker .empty");
  if (empty) empty.hidden = shown !== 0;
}

function announcePlan(termId) {
  const el = document.getElementById("plan-announcer");
  if (!el || !document.getElementById("v-plan").checked) return;
  const courses = planCourses(termId);
  const clashes = planConflicts(courses);
  const gened = GENED[termId];
  const suffix = gened && gened.status === "loading" ? " Loading Gen Ed courses."
    : gened && gened.status === "error" ? " Gen Ed courses unavailable." : "";
  el.textContent = `Plan updated: ${courses.length} ${courses.length === 1 ? "course" : "courses"}, ` +
    `${clashes.length} ${clashes.length === 1 ? "conflict" : "conflicts"}.${suffix}`;
}

function refreshPlan() {
  const el = document.getElementById("p-plan");
  if (!el) return;
  if (document.getElementById("v-plan").checked) loadGened(selectedTermId());
  const active = document.activeElement;
  const focusKey = active && active.dataset ? active.dataset.focus : null;
  const search = document.getElementById("plan-search");
  const typed = search ? search.value : "";
  const aside = el.querySelector(".plan-aside");
  const asideTop = aside ? aside.scrollTop : 0;
  const scrollY = window.scrollY;
  el.outerHTML = renderPlanPanel(selectedTermId());
  window.scrollTo(0, scrollY);
  const nextAside = document.querySelector(".plan-aside");
  if (nextAside) nextAside.scrollTop = asideTop;
  const next = document.getElementById("plan-search");
  if (next) next.value = typed;
  applyPlanFilter();
  announcePlan(selectedTermId());
  applyTodayHighlight();
  if (focusKey) {
    const target = document.querySelector(`[data-focus="${focusKey}"]`);
    if (target) target.focus({ preventScroll: true });
    else if (focusKey.startsWith("add-") || focusKey.startsWith("remove-") || focusKey === "filter-clear") {
      document.getElementById("plan-search")?.focus({ preventScroll: true });
    }
  }
}

function togglePlan(termId, key) {
  const i = plan.findIndex((e) => e.term === termId && e.key === key);
  if (i >= 0) plan.splice(i, 1);
  else plan.push({ term: termId, key, role: "take" });
  savePlan();
  refreshPlan();
}

function togglePlanRole(termId, key) {
  const entry = plan.find((e) => e.term === termId && e.key === key);
  if (!entry) return;
  entry.role = entry.role === "ta" ? "take" : "ta";
  savePlan();
  refreshPlan();
}

function clearPlanTerm(termId) {
  plan = plan.filter((e) => e.term !== termId);
  savePlan();
  refreshPlan();
}

function fitText(ctx, text, max) {
  if (ctx.measureText(text).width <= max) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > max) t = t.slice(0, -1);
  return t + "…";
}

function exportPlanPng(termId) {
  const courses = planCourses(termId);
  if (!courses.length) return;
  const term = TERMS.find((t) => t.id === termId);

  const draw = () => {
    const days = courses.some((c) => c.sessions.some((s) => s.day === "Sat")) ? [...DAYS, "Sat"] : DAYS;
    const range = planTimeRange(courses);
    const startMin = range.start, slotCount = range.slots;
    const slotH = 44, headH = 46, timeW = 68, pad = 22, footH = 34, colW = 190;
    const width = pad * 2 + timeW + colW * days.length;
    const height = pad * 2 + headH + slotH * slotCount + footH;
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    const cs = getComputedStyle(document.documentElement);
    const v = (name) => cs.getPropertyValue(name).trim();
    const ink = v("--ink"), muted = v("--muted"), line = v("--line");
    const bars = {
      red: v("--bar-red"), green: v("--bar-green"), blue: v("--bar-blue"),
      magenta: v("--bar-magenta"), purple: v("--bar-purple"), teal: v("--bar-teal")
    };
    const sans = "'IBM Plex Sans Thai', Arial, sans-serif";

    ctx.fillStyle = v("--bg");
    ctx.fillRect(0, 0, width, height);
    ctx.textBaseline = "top";
    ctx.fillStyle = ink;
    ctx.font = `600 18px ${sans}`;
    ctx.fillText(`CEI Schedule · Plan ${term ? term.label : ""}`, pad, pad);

    const gridX = pad + timeW;
    const gridY = pad + headH;
    ctx.fillStyle = muted;
    ctx.font = `500 11px ${sans}`;
    ctx.textAlign = "center";
    days.forEach((d, i) => ctx.fillText(d.toUpperCase(), gridX + colW * (i + 0.5), pad + headH - 18));
    ctx.textAlign = "left";

    for (let r = 0; r < slotCount; r++) {
      const y = gridY + r * slotH;
      ctx.strokeStyle = line;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(gridX, y);
      ctx.lineTo(width - pad, y);
      ctx.stroke();
      if ((startMin + r * SLOT) % 60 === 0 || r === 0) {
        ctx.fillStyle = muted;
        ctx.font = `500 11px ${sans}`;
        ctx.fillText(fmtTime(startMin + r * SLOT), pad, y - 5);
      }
    }
    days.forEach((_, i) => {
      const x = gridX + colW * i;
      ctx.strokeStyle = line;
      ctx.beginPath();
      ctx.moveTo(x, gridY);
      ctx.lineTo(x, gridY + slotH * slotCount);
      ctx.stroke();
    });

    days.forEach((d, dayIndex) => {
      const daySessions = [];
      courses.forEach((c) => c.sessions.forEach((s) => { if (s.day === d) daySessions.push({ c, s }); }));
      daySessions.sort((a, b) => toMin(a.s.start) - toMin(b.s.start));
      const laneEnds = [];
      const placed = daySessions.map(({ c, s }) => {
        let lane = laneEnds.findIndex((end) => end <= toMin(s.start));
        if (lane === -1) { lane = laneEnds.length; laneEnds.push(0); }
        laneEnds[lane] = toMin(s.end);
        return { c, s, lane };
      });
      const lanes = Math.max(1, laneEnds.length);
      placed.forEach(({ c, s, lane }) => {
        const startRow = (toMin(s.start) - startMin) / SLOT;
        const span = (toMin(s.end) - toMin(s.start)) / SLOT;
        const w = (colW - 6) / lanes;
        const x = gridX + colW * dayIndex + 3 + w * lane;
        const y = gridY + startRow * slotH + 2;
        const h = Math.max(slotH - 4, span * slotH - 4);
        ctx.fillStyle = bars[c.color] || bars.blue;
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, 7);
          ctx.fill();
        } else {
          ctx.fillRect(x, y, w, h);
        }
        ctx.fillStyle = "#ffffff";
        ctx.font = `500 10px ${sans}`;
        ctx.fillText(`${s.start}–${s.end}`, x + 8, y + 6);
        ctx.font = `600 11px ${sans}`;
        ctx.fillText(fitText(ctx, c.name, w - 16), x + 8, y + 20);
        if (s.room && h > 42) {
          ctx.font = `400 10px ${sans}`;
          ctx.fillText(fitText(ctx, s.room, w - 16), x + 8, y + 34);
        }
        if (c.planRole === "TA") {
          ctx.setLineDash([4, 3]);
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
          ctx.setLineDash([]);
        }
      });
    });

    ctx.fillStyle = muted;
    ctx.font = `400 11px ${sans}`;
    ctx.fillText(`Exported ${new Date().toLocaleDateString("en-GB")} · plan saved in this browser only`,
      pad, height - pad - 12);

    canvas.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `cei-plan-${termId}-${new Date().toISOString().slice(0, 10)}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
  };

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw, draw);
  else draw();
}

const YEAR_IDS = ["y1", "y2", "y3", "y4"];
const YEAR_LABELS = { y1: "1st Year", y2: "2nd Year", y3: "3rd Year", y4: "4th Year" };

function panelHtml() {
  return TERMS.map((term) =>
    YEAR_IDS.map((yid) => {
      const year = term.years.find((y) => y.id === yid);
      const pid = `p-${term.id}-${yid}`;
      const aria = `${term.label} · ${YEAR_LABELS[yid]}`;
      if (!year) {
        return `<section class="panel" id="${pid}" aria-label="${esc(aria)}">` +
          `<p class="empty">No ${YEAR_LABELS[yid].toLowerCase()} timetable published for ${esc(term.label)}.</p></section>`;
      }
      const notes = year.notes.map((n) => `<li>${esc(n)}</li>`).join("");
      return `<section class="panel" id="${pid}" aria-label="${esc(aria)}">` +
        `<div class="view view-week">${renderWeek(year)}</div>` +
        `<div class="view view-courses">${renderCourses(year, pid)}</div>` +
        `<div class="view view-exams">${renderExams(year)}</div>` +
        `<details class="notes"><summary>Notes on credits and exam arrangements</summary><ul>${notes}</ul></details>` +
        `</section>`;
    }).join("")
  ).join("") + renderPlanPanel(selectedTermId());
}

// Search: filters the visible year's course cards.
function wireSearch() {
  document.querySelectorAll(".panel").forEach((panel) => {
    const input = panel.querySelector(".course-search");
    if (!input) return;
    const cards = Array.from(panel.querySelectorAll(".course-card"));
    const count = panel.querySelector(".count");
    const empty = panel.querySelector(".empty");
    const apply = () => {
      const q = input.value.trim().toLowerCase();
      let shown = 0;
      cards.forEach((card) => {
        const ok = !q || card.dataset.search.includes(q);
        card.hidden = !ok;
        if (ok) shown++;
      });
      count.textContent = shown + (shown === 1 ? " course" : " courses");
      empty.hidden = shown !== 0;
    };
    input.addEventListener("input", apply);
    apply();
  });
}

// Today column highlight, weekdays only.
function applyTodayHighlight() {
  const today = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date().getDay()];
  if (!DAYS.includes(today)) return;
  document.querySelectorAll(`[data-day="${today}"]`).forEach((el) => el.classList.add("is-today"));
}

function renderAll() {
  const ui = snapshotUi();
  document.getElementById("panels").innerHTML = panelHtml();
  Object.entries(ui.searches).forEach(([id, value]) => {
    const input = document.getElementById(id);
    if (input) input.value = value;
  });
  wireSearch();
  applyPlanFilter();
  applyTodayHighlight();
  restoreUi(ui);
}

restoreGenedCache();
renderAll();
if (document.getElementById("v-plan").checked) refreshPlan();
loadLiveData();

// Theme toggle: explicit choice wins, otherwise follow the OS.
const root = document.documentElement;
const toggle = document.getElementById("theme-toggle");
let saved = null;
try { saved = localStorage.getItem("timetable-theme"); } catch (e) { /* storage unavailable */ }
if (saved === "light" || saved === "dark") root.dataset.theme = saved;
const currentTheme = () => root.dataset.theme ||
  (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const labelToggle = () => { toggle.textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode"; };
toggle.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("timetable-theme", next); } catch (e) { /* storage unavailable */ }
  labelToggle();
});
labelToggle();

// Plan actions: delegated, so every re-render keeps working.
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-plan-add],[data-plan-remove],[data-plan-role],[data-plan-clear],[data-plan-download],[data-plan-gened-retry],[data-plan-day],[data-plan-filter-clear]");
  if (!btn) return;
  const termId = selectedTermId();
  if (btn.hasAttribute("data-plan-add")) togglePlan(termId, btn.dataset.planAdd);
  else if (btn.hasAttribute("data-plan-remove")) togglePlan(termId, btn.dataset.planRemove);
  else if (btn.hasAttribute("data-plan-role")) togglePlanRole(termId, btn.dataset.planRole);
  else if (btn.hasAttribute("data-plan-download")) exportPlanPng(termId);
  else if (btn.hasAttribute("data-plan-gened-retry")) {
    GENED[termId] = { status: "idle", courses: [] };
    loadGened(termId);
    refreshPlan();
  }
  else if (btn.hasAttribute("data-plan-day")) {
    const day = btn.dataset.planDay;
    const i = planFilter.days.indexOf(day);
    if (i >= 0) planFilter.days.splice(i, 1);
    else planFilter.days.push(day);
    refreshPlan();
  }
  else if (btn.hasAttribute("data-plan-filter-clear")) {
    planFilter = { cohort: "all", credit: "", days: [], hideConflicts: false, sort: planFilter.sort };
    const search = document.getElementById("plan-search");
    if (search) search.value = "";
    refreshPlan();
  }
  else if (btn.hasAttribute("data-plan-clear")) {
    if (btn.dataset.armed === "1") {
      clearPlanTerm(termId);
    } else {
      btn.dataset.armed = "1";
      btn.textContent = "Click again to clear";
      btn.focus({ preventScroll: true });
    }
  }
});
document.addEventListener("input", (e) => {
  if (e.target && e.target.id === "plan-search") applyPlanFilter();
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (!el || !el.hasAttribute) return;
  if (el.hasAttribute("data-plan-sort")) planFilter.sort = el.value;
  else if (el.hasAttribute("data-plan-cohort")) planFilter.cohort = el.value;
  else if (el.hasAttribute("data-plan-credit")) planFilter.credit = el.value;
  else if (el.hasAttribute("data-plan-hide-conflicts")) planFilter.hideConflicts = el.checked;
  else return;
  refreshPlan();
});
document.querySelectorAll('input[name="term"]').forEach((radio) => radio.addEventListener("change", () => {
  if (!document.getElementById("v-plan").checked) return;
  loadGened(selectedTermId());
  refreshPlan();
}));
document.querySelectorAll('input[name="view"]').forEach((radio) => radio.addEventListener("change", () => {
  if (!document.getElementById("v-plan").checked) return;
  loadGened(selectedTermId());
  refreshPlan();
}));
// Start the GenEd request before the Plan click lands.
const planLabel = document.querySelector('label[for="v-plan"]');
const planRadio = document.getElementById("v-plan");
["pointerenter", "touchstart"].forEach((event) => planLabel.addEventListener(event, () => loadGened(selectedTermId()), { passive: true }));
planRadio.addEventListener("focus", () => loadGened(selectedTermId()));
</script>
