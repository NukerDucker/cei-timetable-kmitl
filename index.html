<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMITL Computer Engineering | Timetables 2026</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f2;
    --surface: #ffffff;
    --card: #ffffff;
    --ink: #232323;
    --muted: #5f5f5f;
    --line: #e2dfd9;
    --line-strong: #cfc7c0;
    --guide: #d8d5cf;
    --frame: #cfc7c0;
    --focus: #232323;
    --orange: #c94e17;
    --on-orange: #ffffff;
    --bar-red: #c4442c;
    --bar-green: #0e7a3b;
    --bar-blue: #0f76d6;
    --bar-magenta: #a33a6b;
    --bar-purple: #6b50f0;
    --bar-teal: #0a6e7a;
    --on-bar: #ffffff;
    --today: rgba(31, 31, 31, 0.04);
    --row-h: 20px;
    --head-h: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1c1b1a;
      --surface: #262523;
      --card: #262523;
      --ink: #f5f2ee;
      --muted: #b9b3ad;
      --line: #3a3734;
      --line-strong: #504b47;
      --guide: #3a3734;
      --frame: #5a5650;
      --focus: #f5f2ee;
      --today: rgba(245, 242, 238, 0.05);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1b1a;
    --surface: #262523;
    --card: #262523;
    --ink: #f5f2ee;
    --muted: #b9b3ad;
    --line: #3a3734;
    --line-strong: #504b47;
    --guide: #3a3734;
    --frame: #5a5650;
    --focus: #f5f2ee;
    --today: rgba(245, 242, 238, 0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    font-family: 'IBM Plex Sans Thai', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: 20px 20px 48px;
  }
  .wrap { max-width: 1224px; margin: 0 auto; }
  .shell { background: transparent; }
  .masthead {
    display: grid;
    grid-template-columns: 7fr 2fr 3fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--frame);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .kicker {
    font-size: 0.6875rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.3;
    color: var(--muted);
  }
  h1 {
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-top: 4px;
  }
  .card-label {
    display: block;
    font-size: 0.62rem; font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted);
  }
  .card-value { display: block; font-size: 1.35rem; font-weight: 600; margin-top: 4px; line-height: 1.1; }
  .accent-card { background: var(--orange); color: #ffffff; }
  .accent-card .card-label { color: #ffffff; }

  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* --- sticky controls --- */
  .controls {
    position: sticky; top: 12px; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
    padding: 8px 12px; margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--frame);
    border-radius: 8px;
  }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs + .tabs { border-left: 1px solid var(--line-strong); padding-left: 16px; }
  .tabs label {
    display: inline-flex; align-items: center;
    min-height: 34px; padding: 6px 14px;
    border: 1px solid var(--frame); border-radius: 6px;
    background: var(--card); color: var(--ink);
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif; font-size: 0.8125rem; font-weight: 500;
    cursor: pointer; user-select: none;
  }
  .tabs label:hover { background: var(--bg); }
  #theme-toggle {
    margin-left: auto;
    min-height: 34px; padding: 6px 14px;
    border: 1px solid var(--frame); border-radius: 6px;
    background: var(--card); color: var(--ink);
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif; font-size: 0.8125rem;
    cursor: pointer;
  }
  #theme-toggle:hover { background: var(--bg); }

  #t-y1:checked ~ .wrap label[for="t-y1"],
  #t-y2:checked ~ .wrap label[for="t-y2"],
  #t-y3:checked ~ .wrap label[for="t-y3"],
  #v-week:checked ~ .wrap label[for="v-week"],
  #v-courses:checked ~ .wrap label[for="v-courses"],
  #v-exams:checked ~ .wrap label[for="v-exams"] {
    background: #1a1816; color: #ffffff; border-color: #1a1816;
  }
  #t-y1:focus-visible ~ .wrap label[for="t-y1"],
  #t-y2:focus-visible ~ .wrap label[for="t-y2"],
  #t-y3:focus-visible ~ .wrap label[for="t-y3"],
  #v-week:focus-visible ~ .wrap label[for="v-week"],
  #v-courses:focus-visible ~ .wrap label[for="v-courses"],
  #v-exams:focus-visible ~ .wrap label[for="v-exams"],
  #theme-toggle:focus-visible,
  .course-search:focus-visible,
  .notes summary:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  .panel { display: none; }
  #t-y1:checked ~ .wrap #p-y1,
  #t-y2:checked ~ .wrap #p-y2,
  #t-y3:checked ~ .wrap #p-y3 { display: block; }

  .view { display: none; }
  #v-week:checked ~ .wrap .view-week,
  #v-courses:checked ~ .wrap .view-courses,
  #v-exams:checked ~ .wrap .view-exams { display: block; }

  /* --- week view --- */
  .legend {
    display: flex; flex-wrap: wrap; gap: 4px 16px;
    font-size: 0.7rem; color: var(--muted);
    margin: 0 0 8px;
  }
  .legend span { display: inline-flex; align-items: center; }
  .legend i {
    width: 9px; height: 9px; border-radius: 2px;
    display: inline-block; margin-right: 5px; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
  }
  .grid {
    display: grid;
    grid-template-columns: 64px repeat(5, minmax(0, 1fr));
    grid-template-rows: var(--head-h) repeat(25, var(--row-h));
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .g-corner, .g-head {
    display: flex; align-items: center;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
  }
  .g-corner { grid-row: 1; grid-column: 1; padding-left: 2px; }
  .g-head { grid-row: 1; justify-content: center; }
  .g-head.is-today { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
  .g-time {
    grid-column: 1;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.72rem; color: var(--muted);
    text-align: right; padding-right: 8px;
    transform: translateY(-7px);
  }
  .g-time-first { transform: none; }
  .g-day {
    grid-row: 2 / -1;
    display: grid;
    grid-template-rows: subgrid;
    border-left: 1px dashed var(--guide);
    background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: 100% calc(var(--row-h) * 2);
  }
  .g-day.is-today { background-color: var(--today); }
  .g-lunch {
    position: relative; z-index: 1;
    grid-column: 2 / 7;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
    border-top: 1px dashed var(--guide);
    border-bottom: 1px dashed var(--guide);
  }
  .g-block {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; gap: 2px;
    margin: 2px; padding: 8px 10px;
    border-radius: 8px; overflow: hidden;
    background: var(--bar-blue); color: var(--on-bar);
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
  }
  .subject-red { background: var(--bar-red); }
  .subject-green { background: var(--bar-green); }
  .subject-magenta { background: var(--bar-magenta); }
  .subject-blue { background: var(--bar-blue); }
  .subject-purple { background: var(--bar-purple); }
  .subject-teal { background: var(--bar-teal); }
  .gb-time { font-size: 0.72rem; font-weight: 500; }
  .gb-name { font-size: 0.8125rem; font-weight: 600; line-height: 1.15; }
  .gb-room { font-size: 0.72rem; }
  .gb-tag {
    align-self: flex-start;
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* --- courses view --- */
  .course-tools {
    display: flex; align-items: center; gap: 12px;
    margin: 2px 0 12px;
  }
  .course-search {
    flex: 1; min-width: 0;
    min-height: 40px; padding: 8px 12px;
    font: inherit; font-size: 0.875rem;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 6px;
  }
  .count {
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.75rem; color: var(--muted); white-space: nowrap;
  }
  .course-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .course-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .cc-top { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }
  .cc-top h3 {
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.9375rem; font-weight: 600; line-height: 1.25;
  }
  .tag {
    flex: none;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.62rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted);
  }
  .cc-dot {
    width: 10px; height: 10px; border-radius: 3px;
    flex: none; display: inline-block; margin-right: 7px;
    vertical-align: 1px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
  }
  .cc-code {
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.75rem; color: var(--muted);
    margin-top: 2px;
  }
  .cc-sessions { list-style: none; margin-top: 6px; }
  .cc-sessions li {
    font-size: 0.8125rem;
    display: flex; flex-wrap: wrap; gap: 2px 8px;
    padding: 2px 0;
  }
  .s-day { font-weight: 600; min-width: 32px; }
  .s-room { color: var(--muted); }
  .cc-lect { font-size: 0.8125rem; margin-top: 6px; }
  .cc-exam {
    font-size: 0.75rem; color: var(--muted);
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--line);
  }
  .empty {
    padding: 16px 0;
    font-size: 0.875rem; color: var(--muted);
  }

  /* --- exams view --- */
  .exam-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  .exam-table th {
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.72rem; font-weight: 600;
    text-align: left; color: var(--muted);
    padding: 0 12px 8px;
  }
  .exam-table td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  .exam-table .exam-course { font-weight: 500; }
  .note { color: var(--muted); font-style: italic; }

  .notes {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 0.8125rem; color: var(--muted);
  }
  .notes summary {
    display: flex; align-items: center;
    min-height: 34px;
    font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
    font-size: 0.8125rem; font-weight: 500;
    color: var(--ink); cursor: pointer;
  }
  .notes ul { margin: 6px 0 0 18px; }
  .notes li { padding: 2px 0; }

  .noscript { padding: 16px; border: 1px solid var(--line-strong); border-radius: 8px; }

  @media (min-width: 1000px) {
    .course-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 760px) {
    .course-list { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    body { padding: 12px 12px 16px; }
    .masthead { grid-template-columns: 1fr; gap: 6px; margin-bottom: 6px; }
    .stat-card, .accent-card { display: none; }
    .card { padding: 10px 12px; }
    .kicker { display: none; }
    h1 { font-size: 1.35rem; }
    .controls { gap: 4px 8px; padding: 6px 8px; margin-bottom: 6px; top: 8px; }
    .tabs + .tabs {
      border-left: 0; padding-left: 0;
      border-top: 1px solid var(--line-strong); padding-top: 4px;
    }
    .legend {
      flex-wrap: nowrap; overflow-x: auto; white-space: nowrap;
      gap: 0 14px; font-size: 0.68rem; margin: 0 0 4px;
      padding-bottom: 2px;
    }
    .tabs { gap: 4px; }
    .tabs label { min-height: 44px; padding: 8px 12px; font-size: 0.78rem; }
    #theme-toggle { min-height: 44px; padding: 8px 10px; margin-left: 0; }
    .course-search { min-height: 44px; }
    .course-card { padding: 11px 12px; }
    .grid { display: block; border-right: 0; }
    .g-corner, .g-head, .g-time, .g-lunch { display: none; }
    .g-day {
      display: block; grid-row: auto;
      border-left: 0; border-top: 1px solid var(--line);
      background-image: none;
      padding: 0;
    }
    .g-day.is-today::before {
      text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px;
    }
    .g-day::before {
      content: attr(data-day);
      display: block;
      font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
      font-size: 0.8125rem; font-weight: 600;
      margin-bottom: 2px;
    }
    .g-day:empty::after {
      content: "No classes";
      display: block;
      font-size: 0.8125rem; color: var(--muted);
      padding: 4px 0 8px;
    }
    .g-block {
      display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 8px;
      min-height: 44px;
      margin: 0 0 1px; padding: 8px 10px;
      border-radius: 8px;
    }
    .gb-time { flex: 0 0 86px; }
    .gb-name { flex: 1 1 120px; font-size: 0.875rem; }
    .gb-room { flex: 0 0 auto; margin-left: auto; }
    .gb-tag { flex: 0 0 auto; }
    .exam-table thead { display: none; }
    .exam-table tr { display: block; padding: 6px 0; border-top: 1px solid var(--line); }
    .exam-table td {
      display: inline; border: 0; padding: 0;
      font-size: 0.8125rem; line-height: 1.35;
    }
    .exam-table td.exam-course { display: block; margin-bottom: 2px; }
    .exam-table td[data-label="Midterm"],
    .exam-table td[data-label="Final"] { margin-right: 10px; }
    .exam-table td[data-label="Time"] { display: block; margin-top: 1px; }
    .exam-table td::before {
      content: attr(data-label) ": ";
      font-family: 'IBM Plex Sans Thai', Arial, sans-serif;
      font-size: 0.72rem; color: var(--muted);
    }
    .notes { margin-top: 8px; padding-top: 6px; }
    .notes summary { min-height: 44px; }
  }

  @media print {
    :root { --row-h: 22px; --head-h: 34px; }
    body { padding: 0; background: #fff; color: #000; }
    .shell { border: 0; border-radius: 0; padding: 0; background: #fff; }
    .controls, .legend, .course-tools, .notes { display: none; }
    .wrap { max-width: none; }
    .grid { min-width: 0; }
    .g-block, .tag, .masthead { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

<input class="sr" type="radio" name="yr" id="t-y1" checked>
<input class="sr" type="radio" name="yr" id="t-y2">
<input class="sr" type="radio" name="yr" id="t-y3">
<input class="sr" type="radio" name="view" id="v-week" checked>
<input class="sr" type="radio" name="view" id="v-courses">
<input class="sr" type="radio" name="view" id="v-exams">

<div class="wrap shell">
  <header class="masthead">
    <div class="card title-card">
      <p class="kicker">KMITL &middot; Faculty of Engineering</p>

      <span class="card-value">2026</span>

  <nav class="controls" aria-label="Timetable controls">

      <label for="t-y1">1st Year</label>
      <label for="t-y2">2nd Year</label>
      <label for="t-y3">3rd Year</label>

      <label for="v-week">Week</label>
      <label for="v-courses">Courses</label>
      <label for="v-exams">Exams</label>

    <button id="theme-toggle" type="button">Dark mode</button>
  </nav>

  <noscript><p class="noscript">This timetable renders from its schedule data with JavaScript. Enable JavaScript to view it.</p></noscript>

  <main id="panels"></main>
</div>

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmtTime = (min) => String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtDate = (iso) => {
  const d = new Date(iso + "T00:00:00");
  return `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
};
const typeLabel = (t) => ({ lecture: "Lecture", lab: "Lab", elective: "Elective", gened: "Gen Ed" }[t] || "Lecture");

function renderWeek(year) {
  const legend = year.courses.map((c) =>
    `<span><i class="subject-${esc(c.color)}" aria-hidden="true"></i>${esc(c.name)}</span>`
  ).join("");
  let h = `<div class="legend">${legend}</div><div class="grid">`;

  h += '<div class="g-corner">Time</div>';
  DAYS.forEach((d) => { h += `<div class="g-head" data-day="${d}">${d}</div>`; });
  for (let r = 0; r < SLOTS; r++) {
    const minute = DAY_START + r * SLOT;
    if (minute % 60 !== 0) continue;
    const first = r === 0 ? " g-time-first" : "";
    h += `<div class="g-time${first}" style="grid-row:${r + 2}">${fmtTime(minute)}</div>`;
  }
  const lunchRow = (12 * 60 - DAY_START) / SLOT + 2;
  h += `<div class="g-lunch" style="grid-row:${lunchRow} / ${lunchRow + 2}">Lunch</div>`;

  DAYS.forEach((d, i) => {
    const sessions = [];
    year.courses.forEach((c) => c.sessions.forEach((s) => {
      if (s.day === d) sessions.push({ ...s, course: c });
    }));
    sessions.sort((a, b) => toMin(a.start) - toMin(b.start));
    h += `<div class="g-day" data-day="${d}" style="grid-column:${i + 2}">`;
    sessions.forEach((s) => {
      const start = toMin(s.start);
      const snapped = DAY_START + Math.floor((start - DAY_START) / SLOT) * SLOT;
      const localRow = (snapped - DAY_START) / SLOT + 1;
      const span = Math.max(1, Math.round((toMin(s.end) - snapped) / SLOT));
      const type = s.type || s.course.type;
      h += `<div class="g-block type-${type} subject-${esc(s.course.color)}" style="grid-row:${localRow} / span ${span}">` +
        `<span class="gb-time">${esc(s.start)}–${esc(s.end)}</span>` +
        `<span class="gb-name">${esc(s.course.name)}</span>` +
        (s.room ? `<span class="gb-room">${esc(s.room)}</span>` : "") +
        (type !== "lecture" ? `<span class="gb-tag">${typeLabel(type)}</span>` : "") +
        `</div>`;
    });
    h += "</div>";
  });
  h += "</div>";
  return h;
}

function renderCourses(year) {
  const cards = year.courses.map((c) => {
    const search = [
      c.name, c.code, c.credits, c.lecturers.join(" "), typeLabel(c.type),
      c.sessions.map((s) => `${s.day} ${s.start} ${s.end} ${s.room || ""}`).join(" ")
    ].join(" ").toLowerCase();

    const sessions = c.sessions.map((s) => {
      const kind = s.type ? ` <span class="s-room">(${typeLabel(s.type)})</span>` : "";
      return `<li><span class="s-day">${esc(s.day)}</span><span>${esc(s.start)}–${esc(s.end)}</span>` +
        (s.room ? `<span class="s-room">${esc(s.room)}</span>` : "") + kind + `</li>`;
    }).join("");

    const mid = c.exams.mid ? fmtDate(c.exams.mid) : c.exams.midNote;
    const fin = c.exams.final ? fmtDate(c.exams.final) : c.exams.finalNote;
    const examLine = c.exams.mid || c.exams.final
      ? `Mid ${esc(mid)} &middot; Final ${esc(fin)}`
      : `Exams: ${esc(mid || "By instructor")}`;

    return `<article class="course-card" data-search="${esc(search)}">` +
      `<div class="cc-top"><h3><span class="cc-dot subject-${esc(c.color)}" aria-hidden="true"></span>${esc(c.name)}</h3>` +
      (c.type !== "lecture" ? `<span class="tag">${typeLabel(c.type)}</span>` : "") +
      `</div>` +
      `<p class="cc-code">${esc(c.code)} &middot; ${esc(c.credits)}</p>` +
      `<ul class="cc-sessions">${sessions}</ul>` +
      `<p class="cc-lect">${esc(c.lecturers.join(" · "))}</p>` +
      `<p class="cc-exam">${examLine}</p>` +
      `</article>`;
  }).join("");

  return `<div class="course-tools">` +
    `<input class="course-search" type="search" id="search-${year.id}" name="search-${year.id}" placeholder="Search course, code, lecturer, room" aria-label="Search courses for ${esc(year.label)}">` +
    `<span class="count" aria-live="polite">${year.courses.length} courses</span>` +
    `</div>` +
    `<div class="course-list">${cards}</div>` +
    `<p class="empty" hidden>No courses match that search.</p>`;
}

function renderExams(year) {
  const rows = year.courses.map((c) => {
    const mid = c.exams.mid ? fmtDate(c.exams.mid) : `<span class="note">${esc(c.exams.midNote || "By instructor")}</span>`;
    const fin = c.exams.final ? fmtDate(c.exams.final) : `<span class="note">${esc(c.exams.finalNote || "By instructor")}</span>`;
    const sortKey = c.exams.final ? Date.parse(c.exams.final) : (c.exams.mid ? Date.parse(c.exams.mid) : Infinity);
    const time = c.exams.time || c.exams.midNote || c.exams.finalNote || "Not set";
    return { sortKey, html:
      `<tr><td class="exam-course" data-label="Course">${esc(c.name)}</td>` +
      `<td data-label="Midterm">${mid}</td>` +
      `<td data-label="Final">${fin}</td>` +
      `<td data-label="Time">${esc(time)}</td></tr>` };
  }).sort((a, b) => a.sortKey - b.sortKey).map((r) => r.html).join("");

  return `<table class="exam-table">` +
    `<thead><tr><th>Course</th><th>Midterm</th><th>Final</th><th>Time</th></tr></thead>` +
    `<tbody>${rows}</tbody></table>`;
}

const panels = YEARS.map((year) => {
  const notes = year.notes.map((n) => `<li>${esc(n)}</li>`).join("");
  return `<section class="panel" id="p-${year.id}" aria-label="${esc(year.label)}">` +
    `<div class="view view-week">${renderWeek(year)}</div>` +
    `<div class="view view-courses">${renderCourses(year)}</div>` +
    `<div class="view view-exams">${renderExams(year)}</div>` +
    `<details class="notes"><summary>Notes on credits and exam arrangements</summary><ul>${notes}</ul></details>` +
    `</section>`;
}).join("");

document.getElementById("panels").innerHTML = panels;

// Search: filters the visible year's course cards.
document.querySelectorAll(".panel").forEach((panel) => {
  const input = panel.querySelector(".course-search");
  const cards = Array.from(panel.querySelectorAll(".course-card"));
  const count = panel.querySelector(".count");
  const empty = panel.querySelector(".empty");
  const apply = () => {
    const q = input.value.trim().toLowerCase();
    let shown = 0;
    cards.forEach((card) => {
      const ok = !q || card.dataset.search.includes(q);
      card.hidden = !ok;
      if (ok) shown++;
    });
    count.textContent = shown + (shown === 1 ? " course" : " courses");
    empty.hidden = shown !== 0;
  };
  input.addEventListener("input", apply);
  apply();
});

// Today column highlight, weekdays only.
const today = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date().getDay()];
if (DAYS.includes(today)) {
  document.querySelectorAll(`[data-day="${today}"]`).forEach((el) => el.classList.add("is-today"));
}

// Theme toggle: explicit choice wins, otherwise follow the OS.
const root = document.documentElement;
const toggle = document.getElementById("theme-toggle");
let saved = null;
try { saved = localStorage.getItem("timetable-theme"); } catch (e) { /* storage unavailable */ }
if (saved === "light" || saved === "dark") root.dataset.theme = saved;
const currentTheme = () => root.dataset.theme ||
  (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const labelToggle = () => { toggle.textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode"; };
toggle.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("timetable-theme", next); } catch (e) { /* storage unavailable */ }
  labelToggle();
});
labelToggle();
</script>
